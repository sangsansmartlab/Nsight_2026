<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- Glowing filters -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glow-purple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <radialGradient id="baseGlow" cx="50%" cy="80%" r="45%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.45" />
      <stop offset="70%" stop-color="#818cf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#020617" stop-opacity="0" />
    </radialGradient>

    <!-- Cube Faces Gradients -->
    <linearGradient id="topFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#a78bfa" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.75" />
    </linearGradient>

    <linearGradient id="leftFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#0ea5e9" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.65" />
    </linearGradient>

    <linearGradient id="rightFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#9333ea" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#c026d3" stop-opacity="0.65" />
    </linearGradient>

    <linearGradient id="edgeGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
  </defs>

  <!-- Ground Glow -->
  <ellipse cx="50" cy="80" rx="36" ry="12" fill="url(#baseGlow)" />

  <!-- 3 Coordinate Axes Pins with Glowing Nodes -->
  <!-- 1. Top Axis Pin -->
  <line x1="50" y1="20" x2="50" y2="6" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round" />
  <circle cx="50" cy="5" r="4" fill="#38bdf8" filter="url(#glow-cyan)" />
  <circle cx="50" cy="5" r="2" fill="#ffffff" />

  <!-- 2. Left Axis Pin -->
  <line x1="22" y1="64" x2="9" y2="72" stroke="#0ea5e9" stroke-width="2.2" stroke-linecap="round" />
  <circle cx="8" cy="73" r="4" fill="#0284c7" filter="url(#glow-cyan)" />
  <circle cx="8" cy="73" r="2" fill="#e0f2fe" />

  <!-- 3. Right Axis Pin -->
  <line x1="78" y1="64" x2="91" y2="72" stroke="#a855f7" stroke-width="2.2" stroke-linecap="round" />
  <circle cx="92" cy="73" r="4" fill="#9333ea" filter="url(#glow-purple)" />
  <circle cx="92" cy="73" r="2" fill="#fdf4ff" />

  <!-- Isometric Cube Body -->
  <!-- Left Face -->
  <path d="M 22 36 L 50 51 L 50 81 L 22 66 Z" fill="url(#leftFace)" stroke="url(#edgeGlow)" stroke-width="1.2" stroke-linejoin="round" />

  <!-- Right Face -->
  <path d="M 50 51 L 78 36 L 78 66 L 50 81 Z" fill="url(#rightFace)" stroke="url(#edgeGlow)" stroke-width="1.2" stroke-linejoin="round" />

  <!-- Top Face -->
  <path d="M 50 21 L 78 36 L 50 51 L 22 36 Z" fill="url(#topFace)" stroke="url(#edgeGlow)" stroke-width="1.2" stroke-linejoin="round" />

  <!-- Inner Transparent Grid Lines -->
  <line x1="50" y1="51" x2="50" y2="21" stroke="#ffffff" stroke-width="0.8" stroke-opacity="0.6" stroke-dasharray="1.5 1.5" />
  <line x1="22" y1="36" x2="78" y2="66" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.3" />
  <line x1="78" y1="36" x2="22" y2="66" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.3" />

  <!-- Floating Data Voxels / Pixels inside and around Cube -->
  <!-- Left Face Voxels -->
  <rect x="28" y="47" width="3" height="3" fill="#bae6fd" opacity="0.9" rx="0.5" />
  <rect x="35" y="42" width="2.4" height="2.4" fill="#38bdf8" opacity="0.8" rx="0.5" />
  <rect x="33" y="58" width="3.2" height="3.2" fill="#e0f2fe" opacity="0.95" rx="0.5" />
  <rect x="42" y="62" width="2.5" height="2.5" fill="#7dd3fc" opacity="0.85" rx="0.5" />
  <rect x="26" y="55" width="2" height="2" fill="#0284c7" opacity="0.75" />

  <!-- Right Face Voxels -->
  <rect x="57" y="56" width="3" height="3" fill="#f0abfc" opacity="0.9" rx="0.5" />
  <rect x="65" y="48" width="2.6" height="2.6" fill="#e879f9" opacity="0.8" rx="0.5" />
  <rect x="68" y="58" width="3" height="3" fill="#fae8ff" opacity="0.95" rx="0.5" />
  <rect x="55" y="68" width="2.5" height="2.5" fill="#d946ef" opacity="0.85" rx="0.5" />

  <!-- Floating Outward Particles -->
  <rect x="15" y="43" width="2" height="2" fill="#38bdf8" opacity="0.7" rx="0.4" />
  <rect x="18" y="52" width="2.2" height="2.2" fill="#7dd3fc" opacity="0.8" rx="0.4" />
  <rect x="80" y="43" width="2" height="2" fill="#e879f9" opacity="0.7" rx="0.4" />
  <rect x="83" y="52" width="2.2" height="2.2" fill="#d946ef" opacity="0.8" rx="0.4" />
</svg>
